<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACP Music Lab — Unit 3</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f9ff;color:#28334d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.top{padding:22px 5%;background:white;border-bottom:1px solid #e2e6f1;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:22px}.brand span{color:#3478f6}a{color:#3478f6;text-decoration:none}.wrap{max-width:850px;margin:32px auto;padding:0 18px}.card{background:white;border:1px solid #e0e5f1;border-radius:26px;padding:28px;box-shadow:0 6px 24px #202c4510}h1{margin:0;font-size:30px}p{color:#66728a}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.board{background:#f1f3ff;border-radius:20px;margin:22px 0;padding:20px;text-align:center}.board svg{width:100%;max-width:590px;display:block;margin:auto}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{border:2px solid #b4c7ee;background:#edf2ff;color:#3478f6;border-radius:17px;font-weight:800;font-size:27px;padding:18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.next{width:100%;font-size:17px;background:#3478f6;color:white;border-color:#3478f6;margin-top:12px}.status{text-align:center;min-height:30px;font-weight:650;margin:18px 0}.rewards{display:flex;justify-content:center;gap:16px;font-size:32px}.rewards span{opacity:.18}.rewards .earned{opacity:1}.finished{text-align:center;font-size:20px;font-weight:800;color:#b98421}.hidden{display:none}@media(max-width:550px){.card{padding:18px}.top{padding:17px}.brand{font-size:18px}h1{font-size:24px}.answers button{padding:15px}}</style></head><body><header class="top"><div class="brand">ACP <span>Music Lab</span></div><a href="index.html">← Unit 1</a></header><main class="wrap"><article class="card"><div class="row"><div><div style="font-size:12px;letter-spacing:1.5px;font-weight:800;color:#7785a3">FOUNDATION · UNIT 3</div><h1>The Note Detective</h1><p>Meet the notes C, D and E.</p></div><div style="white-space:nowrap;font-weight:800">⭐ <span id="score">0</span>/5</div></div><div class="board"><strong id="question">Which note is this?</strong><svg viewBox="0 0 330 180" role="img" aria-label="Musical staff showing a note"><g stroke="#8e99af" stroke-width="1.6"><path d="M22 40H308 M22 60H308 M22 80H308 M22 100H308 M22 120H308"/></g><line id="ledger" x1="151" x2="185" y1="140" y2="140" stroke="#444568" stroke-width="2"/><ellipse id="head" cx="168" cy="140" rx="13" ry="10.5" fill="#444568" transform="rotate(-20 168 140)"/><line id="stem" x1="179" x2="179" y1="137" y2="87" stroke="#444568" stroke-width="2.8"/></svg></div><div class="answers" id="answers"><button data-note="C">C</button><button data-note="D">D</button><button data-note="E">E</button></div><div id="feedback" class="status" aria-live="polite">Tap the correct letter.</div><button id="next" class="next hidden">Next note →</button><div class="rewards" id="rewards"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div><div id="finished" class="finished hidden">🌟 You earned your star!</div><button id="again" class="next hidden">Play again</button></article></main><script>(function(){const seq=['C','D','E','D','C','E','C','D'];const heights={C:140,D:130,E:120};let round=0,score=0,locked=false,done=false;const $=id=>document.getElementById(id);function render(){const n=seq[round%seq.length],y=heights[n];$('head').setAttribute('cy',y);$('head').setAttribute('transform',`rotate(-20 168 ${y})`);$('stem').setAttribute('y1',y-3);$('stem').setAttribute('y2',y-53);$('ledger').style.display=n==='C'?'':'none';$('score').textContent=score;document.querySelectorAll('#rewards span').forEach((el,i)=>el.classList.toggle('earned',i<score));document.querySelectorAll('#answers button').forEach(el=>el.disabled=locked||done)}document.querySelectorAll('#answers button').forEach(b=>b.addEventListener('click',()=>{if(locked||done)return;let n=seq[round%seq.length];if(b.dataset.note===n){locked=true;$('feedback').textContent='✓ Correct! That’s '+n+'.';$('next').textContent=score===4?'Collect your star ⭐':'Next note →';$('next').classList.remove('hidden')}else $('feedback').textContent='Try another answer!';render()}));$('next').onclick=()=>{score++;locked=false;$('next').classList.add('hidden');if(score>=5){done=true;$('finished').classList.remove('hidden');$('again').classList.remove('hidden');$('feedback').textContent='Wonderful work!';$('question').textContent='You found five notes!'}else{round++;$('feedback').textContent='Tap the correct letter.'}render()};$('again').onclick=()=>{round=0;score=0;locked=false;done=false;$('finished').classList.add('hidden');$('again').classList.add('hidden');$('question').textContent='Which note is this?';$('feedback').textContent='Tap the correct letter.';render()};render()})();</script></body></html>
